min_version = "2026.9.1"

[settings]
locked = true

[bootstrap.packages]
"brew:openfortivpn" = "latest"

[tools]
actionlint = "1.7.12"
xcodegen = "2.46.0"

[tasks.bootstrap]
description = "Verify Xcode and generate the project"
run = """
version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
major="${version%%.*}"
if [ "$major" -lt 26 ]; then
  echo "FortiBar requires Xcode 26 or newer; found Xcode $version" >&2
  exit 1
fi
xcrun --sdk macosx --show-sdk-path >/dev/null
xcodegen generate
"""

[tasks.generate]
description = "Regenerate the Xcode project"
run = "xcodegen generate"

[tasks.lint]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.test]
description = "Build the app and run its unit tests"
depends = ["generate"]
run = """
xcodebuild -quiet test \
  -project FortiBar.xcodeproj \
  -scheme FortiBar \
  -destination "platform=macOS,arch=$(uname -m)" \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.ci]
alias = "check"
description = "Run all CI checks"
depends = ["lint"]
run = "mise run test"
