name: FortiBar
options:
  bundleIdPrefix: com.lauritsk
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  FortiBar:
    type: application
    platform: macOS
    sources:
      - path: FortiBar/App
      - path: FortiBar/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauritsk.FortiBar
        PRODUCT_NAME: FortiBar
        INFOPLIST_FILE: FortiBar/Resources/Info.plist
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: FortiBarHelper
        embed: false
    postBuildScripts:
      - name: Embed privileged helper
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/FortiBarHelper"
          - "$(SRCROOT)/FortiBar/Resources/com.lauritsk.FortiBar.Helper.plist"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchServices/FortiBarHelper"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/com.lauritsk.FortiBar.Helper.plist"
        script: |
          set -euo pipefail
          helper_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchServices"
          daemon_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "${helper_dir}" "${daemon_dir}"
          ditto "${BUILT_PRODUCTS_DIR}/FortiBarHelper" "${helper_dir}/FortiBarHelper"
          cp "${SRCROOT}/FortiBar/Resources/com.lauritsk.FortiBar.Helper.plist" "${daemon_dir}/com.lauritsk.FortiBar.Helper.plist"
  FortiBarHelper:
    type: tool
    platform: macOS
    sources:
      - path: FortiBar/Helper
      - path: FortiBar/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauritsk.FortiBar.Helper
        PRODUCT_NAME: FortiBarHelper
        SKIP_INSTALL: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FORTIBAR_ALLOW_HOMEBREW"
  FortiBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FortiBarTests
      - path: FortiBar/Shared/VPNValidation.swift
      - path: FortiBar/Shared/SAMLLogin.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauritsk.FortiBarTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FortiBar:
    build:
      targets:
        FortiBar: all
        FortiBarHelper: all
        FortiBarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FortiBarTests
    archive:
      config: Release
